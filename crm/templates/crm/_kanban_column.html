<section class="kanban-column" data-stage="{{ column.stage }}" aria-labelledby="column-{{ column.stage }}">
    <header class="kanban-column-header">
        <h2 id="column-{{ column.stage }}"><span class="status stage-{{ column.stage }}">{{ column.label }}</span></h2>
        <p class="column-count">Сделок: <strong>{{ column.count }}</strong></p>
    </header>
    {% for deal in column.deals %}
    {% include "crm/_kanban_card.html" %}
    {% empty %}<p class="kanban-empty">В этом этапе сделок нет.</p>{% endfor %}
    {% if column.count > 20 %}<p class="kanban-more"><a href="{% url 'deal_list' %}?stage={{ column.stage }}">Посмотреть все</a></p>{% endif %}
</section>
