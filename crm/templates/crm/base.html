{% load static %}
<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}CRM{% endblock %} · Дипломная CRM</title>
    <link rel="stylesheet" href="{% static 'crm/style.css' %}">
</head>
<body>
    <header class="brand">Дипломная CRM</header>
    {% if user.is_authenticated %}
    <nav class="navigation" aria-label="Основная навигация">
        <a href="{% url 'home' %}">Главная</a>
        <a href="{% url 'client_list' %}">Клиенты</a>
    </nav>
    {% endif %}
    <main class="card {% block card_class %}{% endblock %}">
        {% if messages %}<div aria-live="polite">{% for message in messages %}<p class="notice">{{ message }}</p>{% endfor %}</div>{% endif %}
        {% block content %}{% endblock %}
    </main>
</body>
</html>
