{% extends "crm/base.html" %}
{% block title %}Удаление сделки{% endblock %}
{% block content %}
<h1>Удаление сделки</h1>
<p>Удалить сделку «{{ deal.title }}»? Это действие нельзя отменить.</p>
<form method="post">{% csrf_token %}<div class="actions"><button type="submit" class="danger">Удалить</button><a href="{{ deal.get_absolute_url }}">Отмена</a></div></form>
{% endblock %}
