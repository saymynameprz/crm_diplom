{% extends "crm/base.html" %}
{% block title %}Удаление сделки{% endblock %}
{% block card_class %}form-panel delete-panel{% endblock %}
{% block content %}
<h1>Удаление сделки</h1>
<p class="message message-warning">Удалить сделку «{{ deal.title }}»? Это действие нельзя отменить.</p>
<form method="post" class="form-layout">
    {% csrf_token %}
    <div class="actions form-actions"><button type="submit" class="danger">Удалить</button><a class="button button-secondary" href="{{ deal.get_absolute_url }}">Отмена</a></div>
</form>
{% endblock %}
