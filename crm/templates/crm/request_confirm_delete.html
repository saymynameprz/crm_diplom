{% extends "crm/base.html" %}
{% block title %}Удаление заявки{% endblock %}
{% block content %}
<h1>Удаление заявки</h1>
<p>Удалить заявку «{{ client_request.title }}»? Это действие нельзя отменить.</p>
<form method="post">
    {% csrf_token %}
    <div class="actions"><button type="submit" class="danger">Удалить</button><a href="{{ client_request.get_absolute_url }}">Отмена</a></div>
</form>
{% endblock %}
