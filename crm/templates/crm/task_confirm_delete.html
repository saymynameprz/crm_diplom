{% extends "crm/base.html" %}
{% block title %}Удаление задачи{% endblock %}
{% block content %}
<h1>Удаление задачи</h1>
<p>Удалить задачу «{{ task.title }}»? Это действие нельзя отменить.</p>
<form method="post">
    {% csrf_token %}
    <div class="actions"><button type="submit" class="danger">Удалить</button><a href="{{ task.get_absolute_url }}">Отмена</a></div>
</form>
{% endblock %}
