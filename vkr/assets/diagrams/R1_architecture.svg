<tspan x="30" dy="0">Сплошные стрелки — обработка / доступ к данным; пунктир — данные и отображение.</tspan>
<tspan x="30" dy="18.75">Формы готовят задачу; расчёт запускает представление. Ядро не обращается к SQLite.</tspan>
<tspan x="30" dy="18.75">Обычные изменения могут идти из форм в ORM. Авторизация входит в Django.</tspan>
<tspan x="30" dy="18.75">Пересечения без точки и с дугой не соединяют линии; фоновых процессов нет.</tspan>
