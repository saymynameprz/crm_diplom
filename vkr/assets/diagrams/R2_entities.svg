<text x="30" y="565" fill="#000" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" text-anchor="start">
<tspan x="30" dy="0">Кратности: родитель для одной дочерней записи : дочерние для одного родителя.</tspan>
<tspan x="30" dy="18.75">1 — родитель обязателен; 0..1 — необязателен; 0..N — любое число дочерних записей.</tspan>
<tspan x="30" dy="18.75">ОЧ — при удалении пользователя ссылка очищается. ЗУ — удаление родителя запрещено.</tspan>
<tspan x="30" dy="18.75">ОЧ / ЗУ описывают on_delete Django; не обещают отдельный SQL ON DELETE.</tspan>
<tspan x="30" dy="18.75">Не более одной автоматической задачи на заявку; ручных задач может быть несколько.</tspan>
<tspan x="30" dy="18.75">Прямой связи задачи со сделкой нет. Список созданных ID подтверждения — JSON, не FK.</tspan>
<tspan x="30" dy="18.75">Квалификации, ставки и резервы часов — входы расчёта, не сущности хранения.</tspan>
</text>
